# 1. The name of the workflow as it appears in the GitHub Actions tab
name: Github Action Pipeline

# 2. The trigger events that kick off the workflow automatically
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to manually trigger this workflow from the UI

# 3. The actual work block
jobs:
  # Define a job called "build-and-test"
  build-and-test:
    # Specify the type of runner machine the job will run on
	runs-on: self-hosted

# The sequential steps that the job will execute
steps:
- task: CmdLine@2
  displayName: 'Verify Python syntax'
  inputs:
    script: 'python3 -m compileall -q .'

- task: CmdLine@2
  displayName: 'Build container'
  inputs:
    script: |
      docker build -t ghcr.io/sengraymond/webapp:$(Build.BuildNumber) .

- task: CmdLine@2
  displayName: 'Push image to Azure Container Registry'
  inputs:
    script: 'docker push ghcr.io/sengraymond/webapp:$(Build.BuildNumber)'

- task: CmdLine@2
  displayName: 'Update deployment with new image'
  inputs:
    script: 'kubectl set image --namespace=flask-app deployment webapp-flask-app webapp-flask-app=ghcr.io/sengraymond/webapp:$(Build.BuildNumber)'

 
