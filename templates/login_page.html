<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.5/css/bootstrap.min.css" integrity="sha512-dTfge/zgoMYpP7QbHy4gWMEGsbsdZeCXz7irItjcC3sPUFtf0kuFbDz/ixG7ArTxmDjLXDmezHubeNikyKGVyQ==" crossorigin="anonymous">

        <style>
            body {
                background: #17252f url("{{ url_for('static', filename='inventory-background.jpg' if environment == 'Production' else 'matrix-background.gif') }}") center center / cover fixed no-repeat;
                min-height: 100vh;
            }
            .login-stage {
                align-items: center;
                display: flex;
                justify-content: center;
                min-height: calc(100vh - 50px);
                padding: 35px 15px;
            }
            .login-box {
                background: rgba(255, 255, 255, .96);
                border-radius: 4px;
                box-shadow: 0 12px 35px rgba(0, 0, 0, .25);
                max-width: 430px;
                padding: 32px;
                width: 100%;
            }
            .login-box h1 {
                color: #17252f;
                font-family: Georgia, serif;
                font-size: 30px;
                margin: 0 0 24px;
                text-align: center;
            }
            .login-box .alert {
                margin-bottom: 22px;
            }
            .login-box .btn {
                margin-top: 8px;
                width: 100%;
            }
            @media (max-width: 480px) {
                .login-box {
                    padding: 25px 20px;
                }
            }
        </style>

        <title>GenLogistics</title>
    </head>

    <body>
        <nav class="navbar navbar-inverse">
            <div class="container">
                <div class="navbar-header">
                    <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#navbar" aria-expanded="false" aria-controls="navbar">
                        <span class="sr-only">Toggle navigation</span>
                        <span class="icon-bar"></span>
                        <span class="icon-bar"></span>
                        <span class="icon-bar"></span>
                    </button>
                    <a class="navbar-brand" href="#">GenLogistics</a>
                </div>
            </div>
        </nav>

        <main class="login-stage">
            <div class="login-box">
                <h1>Inventory User Login</h1>
                {% if error %}
                    <div class="alert alert-warning" role="alert">
                        Incorrect username or password
                    </div>
                {% endif %}
                <form action="/login" method="POST">
                    <div class="form-group">
                        <label for="username">Username:</label>
                        <input class="form-control" id="username" name="username" placeholder="Enter your username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password:</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="btn btn-success">Log in</button>
                </form>
            </div>
        </main>

    </body>
</html>
