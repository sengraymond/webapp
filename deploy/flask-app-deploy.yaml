apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-flask-app
  namespace: flask-app
spec:
  replicas: 1
  selector:
    matchLabels:
      component: webapp-flask-app
  template:
    metadata:
      labels:
        app: flask-app
        component: webapp-flask-app

    spec:
      volumes:
        - name: tls-certificate
          secret:
            secretName: webapp-tls
            defaultMode: 0444
        - name: mysql-certificate
          secret:
            secretName: mysql-ca
            defaultMode: 0444

      containers:
        - name: webapp-flask-app
          image: ghcr.io/sengraymond/webapp:7
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "5m"       # Starting baseline — tune based on observed usage
              memory: "256Mi"
            limits:
              cpu: "10m"       # Cap at 2× the request
              memory: "512Mi"
          ports:
            - name: webapp-port
              containerPort: 3000

          # Check if the app is still alive
          readinessProbe:
          #  httpGet:
          #    path: /ready
          #    port: 3000
          #    scheme: HTTPS       # <-- Critical: Tells kubelet to use HTTPS
            exec:
              command:
              - curl
              - -k
              - -v
              - https://127.0.0.1/ready  # Targets localhost internally
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 2

          volumeMounts:
            # Mount TLS certificate and key
            - name: tls-certificate
              mountPath: /webapp/cert.pem
              subPath: tls.crt
              readOnly: true
            - name: tls-certificate
              mountPath: /webapp/key.pem
              subPath: tls.key
              readOnly: true
            # Mount MySQL CA certificate
            - name: mysql-certificate
              mountPath: /webapp/mysql.pem
              subPath: mysql.pem
              readOnly: true

          env:
            # Load APP Secret Key
            - name: APP_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: key
            # Load DB username
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: username
            # Load DB password
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: password
            # Load DB Config
            - name: DB_HOST
              value: "mysql-database-93453.cbak40mmub1m.ap-southeast-1.rds.amazonaws.com"
            - name: DB_NAME
              value: "logistics"
            - name: DB_PORT
              value: "3306"

