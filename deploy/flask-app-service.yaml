apiVersion: v1
kind: Service
metadata:
  name: flask-app-service
  namespace: flask-app
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-subnets: >
      subnet-061061ff63b9a7016,subnet-05548c63ae0aa0742,subnet-0de4b7cc7459e34bf
spec:
  type: LoadBalancer
  selector:
    app: flask-app
  ports:
    - name: webapp-port
      protocol: TCP
      port: 443
      targetPort: 3000


